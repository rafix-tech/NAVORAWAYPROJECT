<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN-NAVORAWAY</title>
</head>
<body>
    <header>

    <h1>NAVORAWAY</h1>

    <p>Your Way, Your Journey</p>

    <nav>
        <a href="/interface.html" target="_main">Home</a>
        <a href="destinations.html" target = "_main">Destinations</a>
        <a href="about.html" target="_main" >About</a>
        <a href="signup.html" target="_main">Signup</a>
    </nav>

</header>
 <main>

        <h2>Login to NAVORAWAY</h2>

        <form>

            <label for="login">Email or Phone Number:</label>
            <input
                type="text"
                id="login"
                name="login"
                placeholder="Enter email or phone number"
                required
            >

            <br><br>

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <br><br>

            <button type="submit">Login</button>

        </form>

    </main>
    
    
</body>
</html>
