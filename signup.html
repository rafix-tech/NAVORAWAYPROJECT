main{

form label {

    color: #0F5132;

main {
    background-color: white;
    width: 1000px;

    width: 50%;

     transform: scale(1.02);

<body>

    <header>

    <div class="logo">
        <div class="logo-mark">
            N
        </div>
    

    

            <div class="logo-text">

                <h1>NAVORAWAY</h1>

                <p>Your Way, Your Journey</p>

            </div>

        </div>

        <nav>

            <a href="/interface.html">Home</a>
            <!-- This is a comment <a href="/destinations.html">Destinations</a>-->
            <a href="/about.html">About</a>
            <a href="/login.html">Login</a>

        </nav>

    </header>

    <main>
        <div class = "travel-section"> 

        </div>
        <div class ="signup-section">
        
        <h2>Create Your <span class ="Navora">NAVORAWAY </span>Account</h2>

        <p>
            Start planning your perfect journey with us.
        </p>

        <form action="">

            <label for="fullname">
                Full Name:
            </label>

            <input
                type="text"
                id="fullname"
                name="fullname"
                placeholder="Enter your full name"
                required
            >

            <br><br>

            <label for="email">
                Email:
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <br><br>

            <label for="phone">
                Phone Number:
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                required
            >

            <br><br>

            <label for="password">
                Password:
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <br><br>

            <label for="confirm-password">
                Confirm Password:
            </label>

            <input
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Confirm your password"
                required
            >

            <br><br>

            <center><button type="submit">
                Create Account
            </button></center>

            <p>
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </form>
        </div>

    </main>

    <footer>
        <div class = "foot">

        <div><h3>NAVORAWAY</h3></div>

        <p>

    </footer>
