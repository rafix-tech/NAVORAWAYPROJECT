    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - NAVORAWAY</title>
</head>

<body>

    <header>

        <h1>NAVORAWAY</h1>
        <p>Your Way, Your Journey</p>

        <nav>
            <a href="/interface.html" target="_main">Home</a>
            <a href="/destinations.html"target="_main">Destinations</a>
            <a href="/about.html" target="_main">About</a>
            <a href="/login.html" target="_main">Login</a>
        </nav>

    </header>
    <main>
        <form action="">
            <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>

        <br><br>

        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password" required>

        <br><br>

        <button type="submit">Create Account</button>
        <p>
    Already have an account?
    <a href="login.html">Login here</a>
</p>
        </form>
    </main>

</body>

</html>
